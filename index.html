<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>捡到志薰的手机</title>
    <link rel="stylesheet" href="style.css?v=36" />
  </head>
  <body>
    <div id="phone">
      <div id="screen">
        <div id="wall"></div>

        <!-- 视图 0：开屏 -->
        <section id="introL" class="screen active" aria-label="开屏">
          <div class="intro-scene" aria-hidden="true">
            <span class="intro-moon"></span>
            <span class="intro-river"></span>
            <span class="intro-glow"></span>
          </div>
          <div class="intro-shade" aria-hidden="true"></div>
          <div class="intro-content">
            <div class="intro-head">
              <span class="intro-kicker" id="introKicker">开屏</span>
              <span class="intro-rule" aria-hidden="true"></span>
            </div>
            <div class="intro-copy" id="introCopy"></div>
            <div class="intro-actions">
              <button class="intro-btn intro-open" id="introOpen" type="button">打开</button>
              <button class="intro-btn intro-no" id="introNo" type="button">不打开</button>
            </div>
          </div>
        </section>

        <!-- 视图 1：锁屏 -->
        <section id="lockL" class="screen" aria-label="锁屏">
          <div class="lk-scrim"></div>
          <div class="lk-date-row">
            <span class="lk-date" id="lkDate"></span>
            <span class="lk-temp" id="lkTemp"></span>
          </div>
          <div class="lk-time" id="lkTime"></div>
          <div class="lk-notif" id="lkNotif" hidden></div>
          <div class="lk-player" id="lkPlayer"></div>
          <button class="lk-btn fl" id="lkFlash" aria-label="手电筒">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
          </button>
          <button class="lk-btn cm" id="lkCam" aria-label="相机">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <div class="lk-hint">向上轻扫以解锁</div>
        </section>

        <!-- 视图 2：密码解锁 -->
        <section id="passL" class="screen" aria-label="输入密码">
          <div id="passBg"></div>
          <div class="pc-top">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 1 1 6 0v3H9z"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M9.5 15.5c1.5 1.3 3.5 1.3 5 0"/></svg>
          </div>
          <div class="pc-title">输入密码</div>
          <div class="pc-hint">提示：你的生日</div>
          <div class="pc-dots" id="pcDots"><i></i><i></i><i></i><i></i></div>
          <div class="pc-pad" id="pcPad">
            <button class="pc-key" type="button" data-pc="1">1</button>
            <button class="pc-key" type="button" data-pc="2">2</button>
            <button class="pc-key" type="button" data-pc="3">3</button>
            <button class="pc-key" type="button" data-pc="4">4</button>
            <button class="pc-key" type="button" data-pc="5">5</button>
            <button class="pc-key" type="button" data-pc="6">6</button>
            <button class="pc-key" type="button" data-pc="7">7</button>
            <button class="pc-key" type="button" data-pc="8">8</button>
            <button class="pc-key" type="button" data-pc="9">9</button>
            <span class="pc-key blank"></span>
            <button class="pc-key" type="button" data-pc="0">0</button>
            <button class="pc-key del" type="button" data-pc="del" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9.5L3 12l6.5 7H21a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button>
          </div>
          <div class="pc-actions">
            <button id="pcSos" type="button">紧急情况</button>
            <button id="pcCancel" type="button">取消</button>
          </div>
        </section>

        <!-- 视图 3：输入昵称 -->
        <section id="nameL" class="screen" aria-label="输入昵称">
          <div class="nm-card">
            <h2 class="nm-title">你的名字是</h2>
            <p class="nm-hint" id="nmHint" hidden></p>
            <input id="nmInput" class="nm-input" type="text" maxlength="12" placeholder="输入昵称" autocomplete="off" spellcheck="false" />
            <button id="nmOk" class="nm-btn" type="button" disabled>继续</button>
            <button id="nmSkip" class="nm-skip" type="button">先跳过</button>
          </div>
        </section>

        <!-- 视图 4：桌面主屏幕 -->
        <section id="homeL" class="screen" aria-label="主屏幕">
          <button id="themeBtn" class="theme-btn" aria-label="切换深浅色模式" title="切换深浅色模式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <div class="home-wrap">
            <div class="hwidgets">
              <div class="hwx wcalx" id="wCal" role="button" tabindex="0" aria-label="打开日历"></div>
              <div class="hwx wphotox" id="wPhoto"></div>
              <div class="hwx wmusicx" id="wMusic"></div>
            </div>
            <div class="hgrid" id="hgrid"></div>
          </div>
          <div class="spot" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            搜索
          </div>
          <div class="dock" id="dock"></div>
        </section>

        <!-- 视图 5~7：App -->
        <div id="appL" class="screen" aria-live="polite"></div>

        <!-- 结局入口：只在表白日期的结果页出现 -->
        <button id="storyCta" class="story-cta" type="button" aria-hidden="true" tabindex="-1">把手机还给他</button>
      </div>

      <div id="sb">
        <span class="l">
          <span class="carrier" id="sbc">中国移动</span>
          <span class="t" id="sbt">10:56</span>
        </span>
        <span class="r">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.3 10.3 0 0 0 8 .6 10.3 10.3 0 0 0 .8 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.3l1.6-1.6c-.4-.4-1-.6-1.6-.6Z"/></svg>
          <span class="bp" id="sbp">79%</span>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect id="sbBat" x="2" y="2" width="18" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>
        </span>
      </div>

      <div id="island"><span class="ia" id="islandArt" aria-hidden="true"></span><span class="ib"><i></i><i></i><i></i><i></i></span></div>
      <div id="hb" aria-label="回到主屏幕"><i></i></div>
      <audio id="lkAudio" preload="metadata"></audio>

      <!-- 结局转场：黑场旁白 -->
      <div id="endVeil" class="end-veil" aria-hidden="true"><div class="end-veil-in" id="endVeilIn"></div></div>

      <!-- 结局：最后那张日记卡片 -->
      <div id="endCoda" class="end-coda" aria-hidden="true">
        <div class="end-coda-card" role="dialog" aria-modal="true" aria-label="日记">
          <span class="end-coda-kicker">日记</span>
          <div class="end-coda-date" id="endCodaDate"></div>
          <div class="end-coda-body" id="endCodaBody"></div>
          <div class="end-coda-quote" id="endCodaQuote"></div>
          <button class="end-coda-close" type="button" data-coda-close>合上</button>
        </div>
      </div>

      <!-- 不打开线：最后那通电话 -->
      <div id="callL" class="call-l" aria-hidden="true">
        <div class="call-kind" id="callKind">KakaoTalk 语音通话</div>
        <div class="call-av" id="callAvatar"></div>
        <div class="call-name" id="callName">志薰</div>
        <div class="call-sub" id="callSub">邀请你进行语音通话</div>
        <div class="call-timer" id="callTimer" hidden>00:00</div>
        <div class="call-caption" id="callCaption"></div>
        <div class="call-actions" id="callIncoming">
          <button class="call-btn decline" id="callDecline" type="button" aria-label="拒绝">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>拒绝</span>
          </button>
          <button class="call-btn answer" id="callAnswer" type="button" aria-label="接听">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>接听</span>
          </button>
        </div>
        <div class="call-actions" id="callActive" hidden>
          <button class="call-btn hangup" id="callHangup" type="button" aria-label="挂断">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>挂断</span>
          </button>
        </div>
        <audio id="callAudio" preload="auto"></audio>
      </div>

      <!-- 结局卡：日记合上之后 -->
      <div id="endCard" class="end-card" aria-hidden="true">
        <div class="end-card-in" role="dialog" aria-modal="true" aria-label="结局">
          <span class="end-card-kicker" id="endCardKicker">END</span>
          <h2 class="end-card-title" id="endCardTitle"></h2>
          <p class="end-card-meta" id="endCardMeta"></p>
          <p class="end-card-line" id="endCardLine"></p>
          <div class="end-card-actions">
            <button class="end-card-restart" id="endRestart" type="button">再看一次</button>
            <button class="end-card-stay" id="endStay" type="button">回到手机</button>
          </div>
        </div>
      </div>

      <!-- 相册：查看大图 -->
      <div id="photoView" class="ph-view" aria-hidden="true">
        <div class="ph-vtop">
          <button class="ph-vback" type="button" data-photo-close aria-label="返回相册">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
            <span>相册</span>
          </button>
          <span class="ph-vcount" id="photoCount"></span>
          <span class="ph-vact">编辑</span>
        </div>
        <div class="ph-stage" id="photoStage"><img id="photoImg" alt="" draggable="false" /></div>
        <button class="ph-arrow prev" id="photoPrev" type="button" data-photo-step="-1" aria-label="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4-8 8 8 8"/></svg>
        </button>
        <button class="ph-arrow next" id="photoNext" type="button" data-photo-step="1" aria-label="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg>
        </button>
        <div class="ph-tools">
          <button class="ph-tool" type="button" aria-label="分享">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          </button>
          <button class="ph-tool" id="photoFav" type="button" data-photo-fav aria-label="收藏" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2 4.8 13a4.6 4.6 0 1 1 6.5-6.5l.7.7.7-.7A4.6 4.6 0 1 1 19.2 13z"/></svg>
          </button>
          <button class="ph-tool" type="button" aria-label="信息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="ph-tool" type="button" aria-label="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9l.8-12"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <script src="content.js?v=45"></script>
    <script src="advisor.js?v=1"></script>
    <script src="app.js?v=43"></script>
  </body>
</html>
